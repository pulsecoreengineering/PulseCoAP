sentence=No-heap CoAP (RFC 7252) client and server for constrained IoT devices.
paragraph=Fixed-buffer, zero-dynamic-allocation CoAP over UDP. Includes Observe (RFC 7641) push notifications, block-wise transfer (RFC 7959), resource discovery (RFC 6690), URI templates, separate responses, IPv6, DTLS/CoAPs (RFC 6347) via mbedTLS PSK, and adapters for Arduino/WiFiUDP, bare-metal lwIP, and POSIX sockets. Part of the Pulse embedded library ecosystem.
